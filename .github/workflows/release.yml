name: Release

# Push a tag like v0.1.0 to publish that version to PyPI, GitHub Container Registry and the
# MCP Registry. No passwords or API tokens are stored: PyPI and the MCP Registry trust this
# workflow through GitHub's OIDC identity ("trusted publishing").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tag, package and server.json versions must agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(uv version --short)"
          server="$(jq -r .version server.json)"
          server_package="$(jq -r '.packages[0].version' server.json)"
          echo "tag=$tag package=$package server.json=$server/$server_package"
          [ "$tag" = "$package" ] && [ "$tag" = "$server" ] && [ "$tag" = "$server_package" ]
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check . && uv run pyright && uv run pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codebase-brain-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.12.4

  container:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nomannazir/codebase-brain-mcp:${{ needs.check.outputs.version }}
            ghcr.io/nomannazir/codebase-brain-mcp:latest

  mcp-registry:
    needs: [check, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Wait until PyPI serves the new version
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/codebase-brain-mcp/${{ needs.check.outputs.version }}/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI never served the release" && exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
