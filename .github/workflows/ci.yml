name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t codebase-brain-mcp:ci .
      - name: Refuses to start publicly without a token
        run: |
          if docker run --rm codebase-brain-mcp:ci; then
            echo "expected the server to refuse to start without CODEBASE_BRAIN_TOKEN" && exit 1
          fi
      - name: Health check answers with a token
        run: |
          docker run -d --name brain -p 8765:8765 -e CODEBASE_BRAIN_TOKEN="$(openssl rand -hex 24)" codebase-brain-mcp:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/healthz && exit 0; sleep 1; done
          docker logs brain && exit 1
