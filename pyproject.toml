[project]
name = "codebase-brain-mcp"
version = "0.2.1"
description = "An MCP server that gives AI agents a cited, searchable memory of a codebase."
readme = "README.md"
authors = [
    { name = "Noman Nazir", email = "nomannazir69@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "rag", "code-search", "ai-agents", "claude", "git"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastembed>=0.9.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "tree-sitter>=0.25.2,<0.26",  # 0.26.0 crashes the process (SIGBUS) while walking big files
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23.2",
]

[project.urls]
Homepage = "https://github.com/Nomannazir/codebase-brain-mcp"
Repository = "https://github.com/Nomannazir/codebase-brain-mcp"
Issues = "https://github.com/Nomannazir/codebase-brain-mcp/issues"

[project.scripts]
codebase-brain = "codebase_brain_mcp.__main__:main"
codebase-brain-mcp = "codebase_brain_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "S603",  # subprocess with a fixed argv list (git); input is validated before it gets there
    "S607",  # "git" resolved from PATH on purpose
    "RUF001", "RUF002", "RUF003",  # "…" and other typographic characters in strings and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108", "E501"]  # asserts, fake tokens, test hosts

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
