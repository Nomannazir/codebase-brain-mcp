[project]
name = "project-brain-mcp"
version = "0.1.0"
description = "An MCP server that gives AI agents a cited, searchable memory of a codebase."
readme = "README.md"
authors = [
    { name = "Noman Nazir", email = "nomannazir69@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
]

[project.scripts]
project-brain = "project_brain_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "S603",  # subprocess with a fixed argv list (git); input is validated before it gets there
    "S607",  # "git" resolved from PATH on purpose
    "RUF001", "RUF002", "RUF003",  # "…" and other typographic characters in strings and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108", "E501"]  # asserts, fake tokens, test hosts

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
